# Dev reverse proxy — one origin (http://localhost) in front of the Vite
# dev server and the Nest backend, so the app behaves like prod (same-origin
# cookies, no CORS) and browsers grant mic/camera access. See
# docs/REQUIREMENTS.md §6.3 for why HTTPS-or-localhost matters here.

server {
    listen 80;
    server_name localhost;

    client_max_body_size 1m; # uploads bypass this service entirely — see /s3

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Direct access to the SeaweedFS S3 API for local testing, e.g.
    # `curl http://localhost/s3/...`. The app itself talks to S3 via
    # presigned URLs whose host is $S3_PUBLIC_URL (see .env.example).
    location /s3/ {
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_pass http://seaweedfs:8333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 512m;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        # Vite's dev client and HMR both ride this same upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
