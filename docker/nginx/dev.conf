# Dev reverse proxy — one origin in front of the Vite dev server and the Nest
# backend, so the app behaves like prod (same-origin cookies, no CORS) and
# browsers grant mic/camera access. See docs/REQUIREMENTS.md §6.3 for why
# HTTPS-or-localhost matters here.
#
# `:80` stays plain HTTP for `http://localhost` on the dev machine itself
# (no cert warning). `:443` is the same origin over TLS — a self-signed dev
# cert from the `devcert` compose service, SAN'd for the LAN IP `tools/dev.mjs`
# prints — so a phone on the same Wi-Fi gets a secure context too (mobile
# browsers refuse `getUserMedia` on plain HTTP for anything but `localhost`;
# see docs/adr/0009's LAN-dev addendum). Both listen directives share every
# location below; nginx only consults `ssl_certificate*` for the `ssl` one.

server {
    listen 80;
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;

    client_max_body_size 1m; # uploads bypass this service entirely — see the :8333 server below

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # LiveKit's client SDK appends `/rtc` (and `/rtc/validate`) to whatever
    # URL it's given, so proxying this one path is enough to carry both
    # signaling and reconnect validation through the same origin/cert as the
    # rest of the app — no separate port (7880) needs to reach the LAN. See
    # `resolveLivekitUrl` (apps/frontend/src/entities/call/room-options.ts).
    location /rtc {
        proxy_pass http://livekit:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        # Vite's dev client and HMR both ride this same upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

# Dedicated 1:1 proxy to SeaweedFS's S3 API — its own port, no path prefix,
# no rewrite. `StorageService`'s presign client signs the SigV4 canonical
# request against $S3_PUBLIC_URL's *path* too; a shared `:80` + `/s3/`
# rewrite (the previous setup) makes the signed path (`/s3/<key>`) disagree
# with the path SeaweedFS actually receives (`/<key>`), so every presigned
# request 403s with SignatureDoesNotMatch — see
# docs/adr/0008-s3-public-url-needs-its-own-port.md. `S3_PUBLIC_URL` must
# point straight at this port with no path suffix (.env.example,
# compose.dev.yaml).
server {
    listen 8333;
    server_name localhost;

    # Parts are capped at MULTIPART_THRESHOLD_BYTES (16 MiB, see
    # packages/contracts) so nginx never needs to buffer more than that in
    # one request; 64m leaves headroom without reopening the door to a
    # single giant unbounded PUT.
    client_max_body_size 64m;
    # Buffering the whole request before forwarding it defeats streaming a
    # large PUT straight through to SeaweedFS and adds needless latency —
    # turn it off so bytes flow as they arrive.
    proxy_request_buffering off;
    # Slow links/large parts can outlast nginx's 60s defaults; large media
    # uploads (up to 1 GiB, see docs/REQUIREMENTS.md §7.6) need more room.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_body_timeout 300s;

    location / {
        proxy_pass http://seaweedfs:8333;
        proxy_http_version 1.1;
        # $http_host, NOT $host: SigV4 signs the `Host` header value
        # verbatim, port included (`localhost:8333`, since that's the
        # non-default port the client's request line/Host header actually
        # carries). nginx's $host strips the port; forwarding that would
        # change the one signed header and 403 with SignatureDoesNotMatch
        # even with no path rewrite anywhere in the chain.
        proxy_set_header Host $http_host;
    }
}
