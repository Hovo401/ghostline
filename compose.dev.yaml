# Development stack — `pnpm dev` runs `docker compose -f compose.dev.yaml up --watch`.
# One origin (http://localhost, via nginx) fronts everything, same as prod,
# so cookies/CORS/mic-camera permissions behave the same in dev — see
# docs/REQUIREMENTS.md §6.3 and docker/nginx/dev.conf.
#
# `develop.watch` (not bind-mount volumes) drives hot reload: bind mounts
# are slow on Docker Desktop for Windows, and watch's file-event sync
# avoids that entirely while still updating the running container in
# place — see docs/adr/0006-docker-compose-watch-on-windows.md.

name: ghostline-dev

x-contracts-watch: &contracts-watch
  action: sync+exec
  path: ./packages/contracts/src
  target: /repo/packages/contracts/src
  exec:
    command: pnpm --filter @ghostline/contracts run build

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432" # local psql / Prisma Studio only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  s3-init:
    image: amazon/aws-cli:2.17.62
    entrypoint: ["/bin/sh", "/init-bucket.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./docker/seaweedfs/init-bucket.sh:/init-bucket.sh:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # web UI — http://localhost:8025

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://valkey:6379
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_URL: http://localhost/s3
    ports:
      - "127.0.0.1:3000:3000" # direct API access for debugging; the app uses it via nginx
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps/backend/src
          target: /repo/apps/backend/src
        - *contracts-watch
        - action: rebuild
          path: ./apps/backend/package.json
        - action: rebuild
          path: ./apps/backend/prisma/schema.prisma
        - action: rebuild
          path: ./pnpm-lock.yaml

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: dev
    command: ["pnpm", "run", "dev:worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://valkey:6379
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_URL: http://localhost/s3
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps/backend/src
          target: /repo/apps/backend/src
        - *contracts-watch
        - action: rebuild
          path: ./apps/backend/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./apps/frontend/src
          target: /repo/apps/frontend/src
        - action: sync
          path: ./apps/frontend/index.html
          target: /repo/apps/frontend/index.html
        - *contracts-watch
        - action: rebuild
          path: ./apps/frontend/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres-data:
  seaweedfs-data:
