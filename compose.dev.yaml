# Development stack — `pnpm dev` runs `docker compose -f compose.dev.yaml up --watch`.
# One origin (http://localhost, via nginx) fronts everything, same as prod,
# so cookies/CORS/mic-camera permissions behave the same in dev — see
# docs/REQUIREMENTS.md §6.3 and docker/nginx/dev.conf.
#
# Open http://localhost in the browser — NOT a container's internal IP
# (the `172.19.0.x` / `Network: …` address Vite prints in its own logs) and
# NOT :5173 directly. Those addresses live inside the Docker network and
# aren't reachable from the host on Docker Desktop for Windows.
#
# `develop.watch` (not bind-mount volumes) drives hot reload: bind mounts
# are slow on Docker Desktop for Windows, and watch's file-event sync
# avoids that entirely while still updating the running container in
# place — see docs/adr/0006-docker-compose-watch-on-windows.md.

name: ghostline-dev

x-contracts-watch: &contracts-watch
  action: sync+exec
  path: ./packages/contracts/src
  target: /repo/packages/contracts/src
  exec:
    command: pnpm --filter @ghostline/contracts run build

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432" # local psql / Prisma Studio only
    volumes:
      - postgres-data:/var/lib/postgresql # postgres 18+ requires a single mount here, not .../data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  s3-init:
    image: amazon/aws-cli:2.17.62
    entrypoint: ["/bin/sh", "/init-bucket.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./docker/seaweedfs/init-bucket.sh:/init-bucket.sh:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # web UI — http://localhost:8025

  # Self-hosted LiveKit SFU (docs/adr/0009), dev mode — no TURN/TLS of its
  # own since nginx's `/rtc` already fronts signaling with a real (if
  # self-signed) cert. Runs off livekit.dev.yaml (not the bare `--dev` CLI
  # flag) so the LiveKit→backend webhook is registered here too — otherwise
  # a closed/crashed tab in dev never told the backend a call ended until
  # `departure_timeout` caught up.
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      CONFIG_SRC: /etc/livekit/livekit.dev.yaml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LAN_IP: ${LAN_IP:-127.0.0.1}
    volumes:
      - ./docker/livekit/livekit.dev.yaml:/etc/livekit/livekit.dev.yaml:ro
      - ./docker/livekit/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "127.0.0.1:7880:7880" # backend's REST calls (token/room admin) + local debugging; clients go through nginx's /rtc
      - "7881:7881" # TURN/TCP fallback — reachable from the LAN (a phone's ICE candidates)
      - "7882:7882/udp" # RTC media — reachable from the LAN
    # No depends_on backend here — backend already depends_on livekit
    # (below), and a webhook POST failing before backend is up is harmless:
    # LiveKit doesn't retry it, but nothing relies on that first delivery
    # (worker's ring-timeout/departure_timeout still clean up any call).

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://valkey:6379
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_URL: http://localhost:8333
      LIVEKIT_API_URL: http://livekit:7880 # container-to-container — .env.example's value is for running the backend directly on the host
    ports:
      - "127.0.0.1:3000:3000" # direct API access for debugging; the app uses it via nginx
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      livekit:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./apps/backend/src
          target: /repo/apps/backend/src
        - *contracts-watch
        - action: rebuild
          path: ./apps/backend/package.json
        - action: rebuild
          path: ./apps/backend/prisma/schema.prisma
        - action: rebuild
          path: ./pnpm-lock.yaml

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: dev
    command: ["pnpm", "run", "dev:worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://valkey:6379
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_URL: http://localhost:8333
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps/backend/src
          target: /repo/apps/backend/src
        - *contracts-watch
        - action: rebuild
          path: ./apps/backend/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./apps/frontend/src
          target: /repo/apps/frontend/src
        - action: sync
          path: ./apps/frontend/index.html
          target: /repo/apps/frontend/index.html
        - *contracts-watch
        - action: rebuild
          path: ./apps/frontend/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  # One-shot: generates the self-signed dev TLS cert nginx's `:443` server
  # uses, SAN'd for the current `LAN_IP` — see docker/nginx/gen-dev-cert.sh
  # and docs/adr/0009's LAN-dev addendum. Writes into the `devcerts` volume,
  # which nginx mounts read-only; only regenerates when the existing cert
  # doesn't already cover `LAN_IP`, so this is a no-op on every `pnpm dev`
  # after the first on a given network.
  devcert:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl >/dev/null && /gen-dev-cert.sh"]
    environment:
      LAN_IP: ${LAN_IP:-127.0.0.1}
    volumes:
      - devcerts:/certs
      - ./docker/nginx/gen-dev-cert.sh:/gen-dev-cert.sh:ro
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8333:8333" # SeaweedFS S3 API — see docker/nginx/dev.conf's :8333 server
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - devcerts:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      seaweedfs:
        condition: service_started
      devcert:
        condition: service_completed_successfully

volumes:
  postgres-data:
  seaweedfs-data:
  devcerts:
